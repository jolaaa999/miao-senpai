[project]
name = "qqbot-dl-senpai"
version = "0.1.0"
description = "QQ 群深度学习学姐机器人 (NoneBot2 + NapCat + OpenAI 兼容中转)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "openai>=1.40.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
mcp = [
    "mcp>=1.2.0,<2",
]
search = [
    "ddgs>=9.0.0",
]
browser = [
    "playwright>=1.40.0",
    "ddgs>=9.0.0",
]
rpa = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "keyboard>=0.13.5",
    "opencv-python-headless>=4.8.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["src/plugins"]
builtin_plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src/plugins", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/plugins"]
include = ["dl_senpai*"]
