### model
model_name_or_path: E:/LLM/models/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj
quantization_bit: 4
quantization_method: bitsandbytes

### dataset
dataset: chatml
dataset_dir: ./dataset
template: qwen
cutoff_len: 384
preprocessing_num_workers: 1
overwrite_cache: true
dataloader_num_workers: 0

### output
output_dir: E:/LLM/outputs/gaoleng-3b-lora
logging_steps: 1
save_steps: 40
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
# 8GB 上 3B 约 20~30s/step，用 max_steps 控制在 ~1 小时内收工
max_steps: 120
lr_scheduler_type: cosine
warmup_steps: 6
fp16: true
ddp_timeout: 180000000
optim: adamw_torch
gradient_checkpointing: true
report_to: none
